global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 2s
    timeout client 15s
    timeout server 15s

frontend www
    bind *:80
    default_backend webservers

backend webservers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web1 web1:80 check inter 2s fall 2 rise 2
    server web2 web2:80 check inter 2s fall 2 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
